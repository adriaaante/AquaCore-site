name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          PAGES: "true"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Если в настройках Pages источник всё ещё «Deploy from a branch»,
      # GitHub параллельно собирает README Джекиллом и его деплой может
      # перетереть наш. Ждём завершения той сборки, чтобы наш деплой лёг
      # последним. Когда источник переключат на «GitHub Actions», этот шаг
      # просто не найдёт легаси-сборку и сразу продолжит.
      - name: Wait for legacy branch build to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            status=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=20" \
              | jq -r '[.workflow_runs[] | select(.name=="pages build and deployment")] | first | .status // "none"')
            echo "legacy build: $status (attempt $i)"
            if [ "$status" = "completed" ]; then break; fi
            if [ "$status" = "none" ] && [ "$i" -ge 6 ]; then
              echo "легаси-сборка не появилась — источник Pages уже GitHub Actions"
              break
            fi
            sleep 10
          done

      - id: deployment
        uses: actions/deploy-pages@v4
